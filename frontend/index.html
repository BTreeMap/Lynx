<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lynx — URL Shortener</title>
  <meta name="description" content="Lynx — a fast, modern URL shortener with privacy-first analytics." />

  <!--
    One mark, three declarations. `favicon.svg` is the primary icon — it scales to every
    tab, bookmark and OS surface from a single file — with the PNGs supplied for the two
    consumers that will not take an SVG: iOS home screens and installed-app icons.
    All are generated from the same paths as the in-app logo (src/components/layout/Logo.tsx).
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Browser chrome follows the app's own background in each theme (see --bg in src/index.css). -->
  <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141e27" media="(prefers-color-scheme: dark)" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
