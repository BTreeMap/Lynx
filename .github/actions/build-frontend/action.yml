name: Build frontend
description: >-
  Install locked frontend dependencies with an explicitly controlled npm cache,
  then build, lint, and test the frontend.

# Every workflow that needs `frontend/dist` uses this action, and it verifies on the
# way to producing it. Building without linting and testing was previously possible —
# and was in fact what every flow except the PR gate's fast job did — so the same
# commit could be published as a binary, baked into an image, and benchmarked without
# anything having checked it. One definition means no flow can drift into that state.
#
# `npm run verify` (build -> lint -> test) is defined in frontend/package.json, so CI
# and a developer's shell run the identical sequence.

inputs:
  save_cache:
    description: Save the npm dependency cache after a successful installation.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: "24"

    - name: Resolve npm cache directory
      id: npm-cache-path
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Restore npm dependency cache
      id: npm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.npm-cache-path.outputs.path }}
        key: v1-lynx-npm-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          v1-lynx-npm-${{ runner.os }}-${{ runner.arch }}-node-24-

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    # Saved before verification, not after: the cache holds resolved dependencies, which
    # a lint or test failure says nothing about. Moving this later would throw away a
    # valid download cache every time a test failed.
    - name: Save trusted npm dependency cache
      if: ${{ inputs.save_cache == 'true' && steps.npm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.npm-cache-path.outputs.path }}
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}

    - name: Build, lint, and test frontend
      shell: bash
      working-directory: frontend
      run: npm run verify
